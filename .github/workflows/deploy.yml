name: Deploy to Byethost

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Create .env file from secrets
        run: |
          cp .env.example .env
          sed -i "s|APP_KEY=|APP_KEY=${{ secrets.APP_KEY }}|g" .env
          sed -i "s|APP_ENV=local|APP_ENV=production|g" .env
          sed -i "s|APP_DEBUG=true|APP_DEBUG=false|g" .env
          sed -i "s|APP_URL=http://localhost|APP_URL=${{ secrets.APP_URL }}|g" .env
          sed -i "s|DB_HOST=127.0.0.1|DB_HOST=${{ secrets.DB_HOST }}|g" .env
          sed -i "s|DB_DATABASE=gift_quest|DB_DATABASE=${{ secrets.DB_DATABASE }}|g" .env
          sed -i "s|DB_USERNAME=root|DB_USERNAME=${{ secrets.DB_USERNAME }}|g" .env
          sed -i "s|DB_PASSWORD=|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|g" .env
          # Quest-specific secrets
          sed -i "s|QUEST_LOGIN=|QUEST_LOGIN=${{ secrets.QUEST_LOGIN }}|g" .env
          sed -i "s|QUEST_PASSWORD=|QUEST_PASSWORD=${{ secrets.QUEST_PASSWORD }}|g" .env
          sed -i "s|QUEST_AGE=|QUEST_AGE=${{ secrets.QUEST_AGE }}|g" .env
          sed -i "s|QUEST_TEXT=|QUEST_TEXT=${{ secrets.QUEST_TEXT }}|g" .env
          sed -i "s|QUEST_CODE=|QUEST_CODE=${{ secrets.QUEST_CODE }}|g" .env

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            phpunit.xml
            .env.example
            README.md
